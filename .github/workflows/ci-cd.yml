name: Drona CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================================
  # STAGE 1: Continuous Integration (Lint & Pytest Evals)
  # ========================================================
  test:
    name: Run Evaluation Suite & Quality Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Quality Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          pytest evals/test_eval.py -v -s

  # ========================================================
  # STAGE 2: Continuous Delivery (Docker Build & Verify)
  # ========================================================
  build-docker:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: drona:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Startup & Healthcheck
        run: |
          echo "Starting Drona verification container..."
          docker run --rm drona:latest python -c "from src.retriever import is_ready; print('Drona Container Ready:', is_ready())"
